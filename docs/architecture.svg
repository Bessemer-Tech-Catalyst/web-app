<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1180" width="1320" height="1180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="a-141414" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141414"/></marker><marker id="a-3f2fd4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3f2fd4"/></marker><marker id="a-a3231a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3231a"/></marker><marker id="a-1f6b3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6b3a"/></marker><marker id="a-5f5b54" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f5b54"/></marker><marker id="a-c9c2b6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c9c2b6"/></marker><marker id="a-b4530a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b4530a"/></marker></defs><rect width="1320" height="1180" fill="#faf8f5"/><text x="40" y="46" font-size="23" font-weight="800" fill="#141414" letter-spacing="-0.01em">The Odyssey — autonomous test orchestration</text><text x="40" y="70" font-size="13.5" fill="#5f5b54">One durable state machine per run. No human between any two stages. ★ marks a judgment the orchestrator makes and shows its working for.</text><rect x="40" y="84" width="380" height="74" rx="10" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text x="56" y="110" font-size="15" font-weight="700" fill="#141414" letter-spacing="0.04em">INPUT</text><text x="56" y="131" font-size="12.5" fill="#5f5b54">URL — the only required input</text><text x="56" y="148" font-size="12.5" fill="#5f5b54">optional: credentials · PRD · one sentence of intent</text><rect x="40" y="300" width="210" height="168" rx="10" fill="#ffffff" stroke="#5f5b54" stroke-width="1.2" stroke-dasharray="4 3"/><text x="56" y="326" font-size="15" font-weight="700" fill="#5f5b54" letter-spacing="0.04em">PLAYWRIGHT MCP</text><text x="56" y="347" font-size="12.5" fill="#5f5b54">Accessibility tree, not vision</text><text x="56" y="364" font-size="12.5" fill="#5f5b54">— deterministic, ~10× cheaper.</text><text x="56" y="381" font-size="12.5" fill="#5f5b54"></text><text x="56" y="398" font-size="12.5" fill="#5f5b54">Read-only by allowlist for the</text><text x="56" y="415" font-size="12.5" fill="#5f5b54">classifier: it may look, never</text><text x="56" y="432" font-size="12.5" fill="#5f5b54">click.</text><rect x="330" y="180" width="300" height="66" rx="10" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text x="346" y="206" font-size="15" font-weight="700" fill="#141414" letter-spacing="0.04em">RECON</text><text x="346" y="227" font-size="12.5" fill="#5f5b54">signs in unaided · crawls · maps every surface</text><rect x="330" y="286" width="300" height="66" rx="10" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text x="346" y="312" font-size="15" font-weight="700" fill="#141414" letter-spacing="0.04em">PLAN</text><text x="346" y="333" font-size="12.5" fill="#5f5b54">human-readable scenarios, not just happy paths</text><path d="M348 392 H612 L630 435 L612 478 H348 L330 435 Z" fill="#f4f2ff" stroke="#3f2fd4" stroke-width="2"/><text x="360" y="419" font-size="15" font-weight="700" fill="#3f2fd4" letter-spacing="0.04em">CRITIQUE ★</text><text x="360" y="440" font-size="12.5" fill="#5f5b54">scores its own plan 0–100 on six dimensions</text><text x="360" y="457" font-size="12.5" fill="#5f5b54">against what Recon actually observed</text><rect x="330" y="518" width="300" height="66" rx="10" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text x="346" y="544" font-size="15" font-weight="700" fill="#141414" letter-spacing="0.04em">GENERATE</text><text x="346" y="565" font-size="12.5" fill="#5f5b54">every locator proved on the live page, or quarantined</text><rect x="330" y="624" width="300" height="66" rx="10" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text x="346" y="650" font-size="15" font-weight="700" fill="#141414" letter-spacing="0.04em">EXECUTE</text><text x="346" y="671" font-size="12.5" fill="#5f5b54">real @playwright/test, parallel workers</text><path d="M348 730 H612 L630 773 L612 816 H348 L330 773 Z" fill="#f4f2ff" stroke="#3f2fd4" stroke-width="2"/><text x="360" y="757" font-size="15" font-weight="700" fill="#3f2fd4" letter-spacing="0.04em">TRIAGE ★</text><text x="360" y="778" font-size="12.5" fill="#5f5b54">broken test, or broken app?</text><text x="360" y="795" font-size="12.5" fill="#5f5b54">rule prior + read-only live look</text><path d="M230 158 L230 170 L480 170 L480 180" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#a-141414)"/><path d="M480 246 L480 286" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#a-141414)"/><path d="M480 352 L480 392" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#a-141414)"/><path d="M480 478 L480 518" fill="none" stroke="#1f6b3a" stroke-width="1.5" marker-end="url(#a-1f6b3a)"/><text x="490" y="502" font-size="11.5" fill="#1f6b3a" font-weight="600">pass</text><path d="M480 584 L480 624" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#a-141414)"/><path d="M480 690 L480 730" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#a-141414)"/><path d="M630 435 L690 435 L690 319 L630 319" fill="none" stroke="#3f2fd4" stroke-width="1.5" marker-end="url(#a-3f2fd4)"/><text x="704" y="372" font-size="12" font-weight="700" fill="#3f2fd4">score &lt; 75 and budget left</text><text x="704" y="390" font-size="12" fill="#5f5b54">→ re-plan against the gaps it just named</text><path d="M630 551 L712 551 L712 300 L630 300" fill="none" stroke="#b4530a" stroke-width="1.5" marker-end="url(#a-b4530a)"/><text x="726" y="452" font-size="12" font-weight="700" fill="#b4530a">nothing emitted, allowance left</text><text x="726" y="470" font-size="12" fill="#5f5b54">→ re-plan against the quarantine reasons</text><path d="M250 384 L292 384 L292 213 L 326 213" fill="none" stroke="#5f5b54" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a-5f5b54)"/><path d="M250 384 L292 384 L292 551 L 326 551" fill="none" stroke="#5f5b54" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a-5f5b54)"/><path d="M250 384 L292 384 L292 773 L 326 773" fill="none" stroke="#5f5b54" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#a-5f5b54)"/><text x="40" y="492" font-size="11.5" fill="#5f5b54">tapped by recon, generate,</text><text x="40" y="508" font-size="11.5" fill="#5f5b54">triage and heal</text><path d="M728 592 H1022 L1040 635 L1022 678 H728 L710 635 Z" fill="#f4f2ff" stroke="#3f2fd4" stroke-width="2"/><text x="740" y="619" font-size="15" font-weight="700" fill="#3f2fd4" letter-spacing="0.04em">SCRIPT_DRIFT → HEAL ★</text><text x="740" y="640" font-size="12.5" fill="#5f5b54">assertion guard: delete, weaken, negate or</text><text x="740" y="657" font-size="12.5" fill="#5f5b54">re-value an assertion → patch rejected</text><rect x="710" y="700" width="330" height="50" rx="10" fill="#ffffff" stroke="#5f5b54" stroke-width="1.6"/><text x="726" y="726" font-size="14" font-weight="700" fill="#5f5b54" letter-spacing="0.04em">ENV_FLAKE → RETRY once</text><rect x="710" y="772" width="330" height="66" rx="10" fill="#ffffff" stroke="#a3231a" stroke-width="1.6"/><text x="726" y="798" font-size="14" font-weight="700" fill="#a3231a" letter-spacing="0.04em">APP_DEFECT → BUG LEDGER</text><text x="726" y="819" font-size="12.5" fill="#5f5b54">Healer withheld. The test stays red.</text><rect x="710" y="860" width="330" height="50" rx="10" fill="#ffffff" stroke="#5f5b54" stroke-width="1.6"/><text x="726" y="886" font-size="14" font-weight="700" fill="#5f5b54" letter-spacing="0.04em">PLAN_ERROR → PLANNER BACKLOG</text><path d="M630 760 L670 760 L670 635 L 710 635" fill="none" stroke="#3f2fd4" stroke-width="1.5" marker-end="url(#a-3f2fd4)"/><path d="M630 773 L670 773 L670 725 L 710 725" fill="none" stroke="#5f5b54" stroke-width="1.5" marker-end="url(#a-5f5b54)"/><path d="M630 786 L670 786 L670 805 L 710 805" fill="none" stroke="#a3231a" stroke-width="1.5" marker-end="url(#a-a3231a)"/><path d="M630 799 L670 799 L670 885 L 710 885" fill="none" stroke="#5f5b54" stroke-width="1.5" marker-end="url(#a-5f5b54)"/><rect x="746" y="500" width="258" height="46" rx="10" fill="#ffffff" stroke="#1f6b3a" stroke-width="1.6"/><text x="762" y="526" font-size="13" font-weight="700" fill="#1f6b3a" letter-spacing="0.04em">RE-RUN THAT ONE TEST</text><path d="M875 592 L875 546" fill="none" stroke="#1f6b3a" stroke-width="1.5" marker-end="url(#a-1f6b3a)"/><path d="M1004 523 L1072 523" fill="none" stroke="#1f6b3a" stroke-width="1.4"/><path d="M1040 635 L1072 635" fill="none" stroke="#3f2fd4" stroke-width="1.4"/><path d="M1040 725 L1072 725" fill="none" stroke="#5f5b54" stroke-width="1.4"/><path d="M1040 805 L1072 805" fill="none" stroke="#a3231a" stroke-width="1.4"/><path d="M1040 885 L1072 885" fill="none" stroke="#5f5b54" stroke-width="1.4"/><path d="M1072 523 L1072 953 L 750 953" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#a-141414)"/><path d="M348 916 H732 L750 953 L732 990 H348 L330 953 Z" fill="#f4f2ff" stroke="#3f2fd4" stroke-width="2"/><text x="360" y="943" font-size="15" font-weight="700" fill="#3f2fd4" letter-spacing="0.04em">REPORT ★</text><text x="360" y="964" font-size="12.5" fill="#5f5b54">scenarios covered · pass/fail · healer actions ·</text><text x="360" y="981" font-size="12.5" fill="#5f5b54">gaps remaining · untested flow risk</text><path d="M480 816 L540 916" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#a-141414)"/><rect x="40" y="1030" width="300" height="84" rx="10" fill="#ffffff" stroke="#141414" stroke-width="1.6"/><text x="56" y="1056" font-size="15" font-weight="700" fill="#141414" letter-spacing="0.04em">COVERAGE MAP</text><text x="56" y="1077" font-size="12.5" fill="#5f5b54">read off the emitted suite, not the plan:</text><text x="56" y="1094" font-size="12.5" fill="#5f5b54">navigation › control › scenario-text › none</text><path d="M378 1030 H642 L660 1072 L642 1114 H378 L360 1072 Z" fill="#f4f2ff" stroke="#3f2fd4" stroke-width="2"/><text x="390" y="1057" font-size="15" font-weight="700" fill="#3f2fd4" letter-spacing="0.04em">RISK LEDGER ★</text><text x="390" y="1078" font-size="12.5" fill="#5f5b54">published weight table · model may</text><text x="390" y="1095" font-size="12.5" fill="#5f5b54">adjust ±15 or is discarded</text><path d="M698 1030 H962 L980 1072 L962 1114 H698 L680 1072 Z" fill="#f4f2ff" stroke="#3f2fd4" stroke-width="2"/><text x="710" y="1057" font-size="15" font-weight="700" fill="#3f2fd4" letter-spacing="0.04em">PRD TRACE ★</text><text x="710" y="1078" font-size="12.5" fill="#5f5b54">proven · exercised · planned-only ·</text><text x="710" y="1095" font-size="12.5" fill="#5f5b54">uncovered — with verbatim quotes</text><path d="M430 990 L430 1010 L190 1010 L 190 1030" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#a-141414)"/><path d="M520 990 L510 1030" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#a-141414)"/><path d="M640 990 L640 1010 L830 1010 L 830 1030" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#a-141414)"/><rect x="1000" y="1030" width="280" height="84" rx="10" fill="#ffffff" stroke="#5f5b54" stroke-width="1.6"/><text x="1016" y="1056" font-size="15" font-weight="700" fill="#5f5b54" letter-spacing="0.04em">WORKSPACE ON DISK</text><text x="1016" y="1077" font-size="12.5" fill="#5f5b54">tests/*.spec.ts · report.json · report.md</text><text x="1016" y="1094" font-size="12.5" fill="#5f5b54">traces · patches · coverage · risk · trace</text><path d="M980 1072 L1000 1072" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#a-141414)"/><rect x="1085" y="180" width="225" height="300" rx="10" fill="#ffffff" stroke="#1f6b3a" stroke-width="1.6"/><text x="1101" y="206" font-size="15" font-weight="700" fill="#1f6b3a" letter-spacing="0.04em">events.ndjson</text><text x="1101" y="227" font-size="12.5" fill="#5f5b54">Every transition emits a</text><text x="1101" y="244" font-size="12.5" fill="#5f5b54">decision event carrying its</text><text x="1101" y="261" font-size="12.5" fill="#5f5b54">rationale, its confidence and</text><text x="1101" y="278" font-size="12.5" fill="#5f5b54">the evidence it cites.</text><text x="1101" y="295" font-size="12.5" fill="#5f5b54"></text><text x="1101" y="312" font-size="12.5" fill="#5f5b54">→ SSE → live Decision Log</text><text x="1101" y="329" font-size="12.5" fill="#5f5b54"></text><text x="1101" y="346" font-size="12.5" fill="#5f5b54">That append-only file is the</text><text x="1101" y="363" font-size="12.5" fill="#5f5b54">database, the crash-recovery</text><text x="1101" y="380" font-size="12.5" fill="#5f5b54">story, the replay mechanism</text><text x="1101" y="397" font-size="12.5" fill="#5f5b54">and the demo.</text><path d="M630 213 L1064 213 L1064 300 L1085 300" fill="none" stroke="#1f6b3a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a-1f6b3a)"/><text x="890" y="206" font-size="11" fill="#1f6b3a" font-weight="600">every transition</text><rect x="300" y="150" width="755" height="860" rx="14" fill="none" stroke="#c9c2b6" stroke-width="1.5" stroke-dasharray="6 4"/><text x="770" y="176" font-size="11.5" fill="#5f5b54" font-weight="700" letter-spacing="0.08em">ORCHESTRATOR — ONE DURABLE STATE MACHINE PER RUN</text></svg>
